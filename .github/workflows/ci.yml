name: CI

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "versions.json"
      - "Vendor/td"
      - "Package.swift"
      - "Sources/**"
      - "Native/**"
      - "Tests/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for a new upstream revision
        run: |
          status=0
          ./scripts/update.py --check || status=$?
          if [ "$status" -eq 2 ]; then
            echo "::notice::New TDLib available. Run ./scripts/update.py on macOS."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

  native:
    if: github.event_name != 'schedule'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install generation tools
        run: brew install cmake gperf
      - name: Test updater and unsupported schema diagnostics
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Generate official TDLib headers
        run: ./scripts/tdlib-native.sh generate
      - name: Verify generated schema and published native artifact
        run: |
          ./scripts/check-native.sh
          git diff --exit-code -- Native/Headers
      - name: Swift native tests
        run: swift test --jobs 2
      - name: Exact-version consumer
        run: ./scripts/check-semver.py
